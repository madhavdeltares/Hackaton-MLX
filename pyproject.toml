[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "precipitation-watch"
version = "0.1.0"
description = "A hackathon prototype for classifying KNMI hourly precipitation."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
dependencies = [
    "knmi-py>=0.2.0",
    "h5py>=3.10,<4",
    "numpy>=1.26,<3",
    "pyproj>=3.6,<4",
    "requests>=2.31,<3",
    "statsmodels>=0.14,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[tool.setuptools]
py-modules = ["precipitation"]
packages = ["arima"]
